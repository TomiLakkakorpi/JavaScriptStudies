<!DOCTYPE html>
<html>
    <head>
        <title>Number Guessing Game</title>
        <meta charset="UTF-8"/>
        <script src="script.js"></script>
    </head>
    <body>
        <h1>Number Guessing Game</h1>
        <p>Guess a number between 1 and 100.</p>
        <input type="number" id="guess" min="1" max="100"/>
        <button id="submit">Submit Guess</button>
        <p id="result"></p>
</html>
